[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-emo-per"
version = "1.0.0"
description = "Empathetic persuasion with dialogue models and custom reinforcement learning losses"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Azlaan Mustafa Samad"}, {name = "Kshitij Mishra"}, {name = "Mauajama Firdaus"}, {name = "Asif Ekbal"}]
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.2,<3", "transformers>=4.45,<6", "nltk>=3.9,<4", "numpy>=1.24,<3"]
figures = ["matplotlib>=3.7,<4"]
test = ["torch>=2.2,<3", "transformers>=4.45,<6", "nltk>=3.9,<4"]

[project.scripts]
rl-emo-per = "rl_emo_per.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
